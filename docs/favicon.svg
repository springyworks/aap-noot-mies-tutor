<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#3b0764" />
      <stop offset="55%" stop-color="#130524" />
      <stop offset="100%" stop-color="#05020a" />
    </radialGradient>
    <linearGradient id="purpleNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0abfc" />
      <stop offset="45%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6d28d9" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#e879f9" />
    </linearGradient>
  </defs>

  <!-- Obsidian Black Squircle Base with Catching Purple Neon Rim -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGlow)" stroke="url(#rimGrad)" stroke-width="3.5" />
  <rect x="6" y="6" width="52" height="52" rx="11" fill="none" stroke="#a855f7" stroke-opacity="0.35" stroke-width="1.2" />

  <!-- Subtle 1960s Lamp Ripple Rays in Deep Violet -->
  <circle cx="32" cy="30" r="20" fill="none" stroke="#9333ea" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="5 4" />
  <circle cx="32" cy="30" r="14" fill="#a855f7" fill-opacity="0.15" />

  <!-- Classic Leesplankje Top Handle / Crown Cutout in Purple -->
  <path d="M 22 13 C 22 9, 42 9, 42 13" fill="none" stroke="#e879f9" stroke-width="2.5" stroke-linecap="round" />

  <!-- Bold Catching Purple-on-Black "A" Monogram + Spark -->
  <path d="M 32 14 L 47 50 L 39.5 50 L 36.2 41 L 27.8 41 L 24.5 50 L 17 50 Z M 32 23.5 L 29.3 35.5 L 34.7 35.5 Z" fill="url(#purpleNeon)" />
  <circle cx="32" cy="11" r="2.6" fill="#f5d0fe" />
</svg>
